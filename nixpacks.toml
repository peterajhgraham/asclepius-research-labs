# Tells Railway/Nixpacks to build the FastAPI backend from the monorepo root.
# Python 3.11 is pinned via the root .python-version file.

[phases.install]
cmds = ["pip install -r asclepius/backend/requirements.txt"]

[start]
cmd = "cd asclepius/backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
