version: "3.9"

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: asclepius
      POSTGRES_PASSWORD: asclepius
      POSTGRES_DB: asclepius
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asclepius"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://asclepius:asclepius@db:5432/asclepius
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn asclepius.api:app --host 0.0.0.0 --port 8000"

  # Optional: MinIO for S3-compatible object storage (dev/test only)
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: asclepius
      MINIO_ROOT_PASSWORD: asclepius123
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    profiles:
      - storage

volumes:
  postgres_data:
  minio_data:
