[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asclepius"
version = "0.1.0"
description = "Structured, Versioned Biological Data Layer – Asclepius Research Labs"
requires-python = ">=3.10"
dependencies = [
    "scipy>=1.10",
    "h5py>=3.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "fastapi>=0.110",
    "typer>=0.12",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.0",
]

[project.scripts]
asclepius = "asclepius.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["asclepius*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
